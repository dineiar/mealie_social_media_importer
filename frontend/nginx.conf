# A path or trailing slash in BACKEND_URL would replace the request path in
# proxy_pass, so keep only scheme, host and port.
map "${BACKEND_URL}" $backend_origin {
    "~^(?<origin>[^/]+//[^/]+)" $origin;
}

# Signed download links carry their credential in the query string, so the
# access log records the path only.
map $request_uri $logged_path {
    "~^(?<path>[^?]*)" $path;
}

log_format no_query '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $logged_path $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

# An empty value makes nginx skip the header, so the backend decides for /api/.
map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/    "";
    default    "no-cache";
}

server {
    listen 8080;
    listen [::]:8080;
    server_tokens off;
    access_log /var/log/nginx/access.log no_query;

    root /usr/share/nginx/html;

    # Headers are set only here: any add_header in a location drops all of these
    # for it. Cache-Control has no "always", so error pages stay uncached.
    # No HSTS: TLS ends at the reverse proxy in front of this container.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $cache_control;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript image/svg+xml;

    # Resolve the backend on each request, so a recreated backend container is
    # found again and the frontend can start before it.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    location /api/ {
        proxy_pass $backend_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # POST /api/imports?wait=true holds the response for up to 10 minutes.
        proxy_read_timeout 660s;

        # Off, because with buffering on nginx spooled a whole 250 MB download
        # from /api/files/ into /tmp/proxy_temp and failed when /tmp was small.
        proxy_buffering off;
    }

    # nginx's error log quotes the whole request line, query string included,
    # and only signed file links carry a credential there. Locations don't
    # nest for proxy_pass, so this repeats the /api/ proxy settings.
    location /api/files/ {
        error_log /var/log/nginx/error.log crit;
        proxy_pass $backend_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # A missing hashed file must be a 404, not the SPA fallback.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
