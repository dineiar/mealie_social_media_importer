[package]
name = "mealie-importer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
getrandom = "0.4.3"
hmac = "0.13.0"
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "multipart", "stream", "json"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = "12.0.1"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
