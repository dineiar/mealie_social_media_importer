[package]
name = "mealie-importer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "multipart", "stream", "json"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = "12.0.1"
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
